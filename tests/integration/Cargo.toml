[package]
name = "last-integration"
description = "near-workspaces sandbox scenarios for the LAST contract"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

# Standalone package: run from WSL/Linux (sandbox binary is Linux/macOS only).
#   LAST_WASM=<path to last.wasm> cargo test --manifest-path tests/integration/Cargo.toml
[dependencies]

[dev-dependencies]
near-workspaces = "=0.24.0"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }
anyhow = "=1.0.104"
serde_json = "=1.0.154"
