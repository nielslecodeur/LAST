[package]
name = "last"
description = "LAST — Last Buyer Wins: NEP-141 token, internal NEAR/LAST market and last-buyer jackpot game (NEAR Testnet)"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

# Versions pinned exactly (see docs/SPEC_V2.md §2.1). Bump only after a full build + test run.
[dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"
uint = { version = "=0.10.2", default-features = false }

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
